name: Publish Unlock PDF to GitHub Pages

# Copies pdf-unlock/ to the gh-pages branch, which GitHub Pages serves at
# https://<owner>.github.io/<repo>/ (Settings -> Pages -> Deploy from a branch -> gh-pages).
on:
  push:
    branches: [main]
    paths:
      - 'pdf-unlock/**'
      - '.github/workflows/pdf-unlock-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-unlock-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push pdf-unlock/ to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pdf-unlock
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publish Unlock PDF from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
